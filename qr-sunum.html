<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Gurman Usta — QR Menü Sunumu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #110406;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* 1200 x 1600 (3:4 ratio - ideal for A5 / Instagram / WhatsApp / Stand) */
        .stand-card {
            width: 1200px;
            height: 1600px;
            background: linear-gradient(150deg, #2a0f12 0%, #1c080b 45%, #0f0305 100%);
            border-radius: 40px;
            position: relative;
            padding: 60px 80px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            border: 3px solid rgba(226, 1, 15, 0.45);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.6);
        }

        /* Ambient Glow & Pattern */
        .stand-card::before {
            content: '';
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 600px;
            background: radial-gradient(ellipse at center, rgba(226, 1, 15, 0.28) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .stand-card::after {
            content: '';
            position: absolute;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(245, 197, 24, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Inner decorative border frame */
        .frame-inner {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            border: 1px solid rgba(245, 197, 24, 0.3);
            border-radius: 28px;
            pointer-events: none;
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Header */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .logo {
            max-width: 440px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.6));
            margin-bottom: 12px;
        }

        .slogan-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(226, 1, 15, 0.18);
            border: 1px solid rgba(226, 1, 15, 0.5);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ff6b75;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(226, 1, 15, 0.2);
        }

        .slogan-sub {
            font-family: 'Playfair Display', serif;
            font-size: 1.45rem;
            color: #f5c518;
            font-weight: 700;
            margin-top: 14px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* QR Center Display Card */
        .qr-display-box {
            background: #ffffff;
            border-radius: 32px;
            padding: 34px 38px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                0 0 0 6px rgba(226, 1, 15, 0.85),
                0 0 35px rgba(226, 1, 15, 0.45);
            margin: 20px 0;
            position: relative;
        }

        .qr-display-box .qr-title {
            color: #1a080b;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-display-box .qr-title svg {
            width: 24px;
            height: 24px;
            fill: #e2010f;
        }

        .qr-image {
            width: 480px;
            height: 480px;
            display: block;
            border-radius: 12px;
        }

        .qr-action-banner {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #e2010f;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 12px 32px;
            border-radius: 50px;
            box-shadow: 0 6px 18px rgba(226, 1, 15, 0.4);
            width: 100%;
        }

        .qr-action-banner svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }

        .url-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(38, 14, 16, 0.85);
            border: 1.5px solid rgba(245, 197, 24, 0.6);
            color: #f5c518;
            padding: 10px 28px;
            border-radius: 24px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            margin-bottom: 10px;
        }

        /* Footer Info */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(226, 1, 15, 0.25);
            margin-bottom: 5px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ea969c;
        }

        .info-item svg {
            width: 24px;
            height: 24px;
            fill: #ff4d58;
            flex-shrink: 0;
        }

        .info-item strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* Print formatting */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .stand-card {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

        </div>
    </div>

</body>
</html>
